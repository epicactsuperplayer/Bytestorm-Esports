<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bytestorm Esports — Match Admin</title>
<style>
  :root{
    --bg:#0a0a0a; --panel:#111; --b1:#242424; --b2:#333;
    --txt:#f5f5f5; --m1:#9a9a9a; --m2:#6f6f6f;
    --accent:#ffffff; --win:#2ecc71; --loss:#e74c3c; --live:#ff3b3b;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--txt);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card{
    width:100%; max-width:440px; background:var(--panel);
    border:1px solid var(--b1); border-radius:14px; padding:28px;
  }
  h1{font-size:18px; font-weight:800; letter-spacing:.02em; margin:0 0 4px}
  .sub{font-size:12px; color:var(--m1); margin:0 0 24px}
  label{display:block; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--m1); margin:16px 0 6px}
  input[type=text], input[type=number], input[type=password], select{
    width:100%; background:#0d0d0d; border:1px solid var(--b2); color:var(--txt);
    border-radius:8px; padding:11px 12px; font-size:14px; font-family:inherit;
  }
  input:focus, select:focus{outline:none; border-color:#666}
  .row{display:flex; gap:12px}
  .row > div{flex:1}
  button{
    width:100%; margin-top:22px; background:var(--accent); color:#0a0a0a;
    border:none; border-radius:8px; padding:13px; font-size:14px; font-weight:800;
    letter-spacing:.02em; cursor:pointer;
  }
  button:active{transform:scale(0.98)}
  button:disabled{opacity:.5; cursor:default}
  .status-msg{margin-top:14px; font-size:13px; text-align:center; min-height:18px}
  .status-msg.ok{color:var(--win)}
  .status-msg.err{color:var(--loss)}
  .gate{max-width:340px}
  .gate input{margin-bottom:14px}
  .live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live);margin-right:6px;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .current-badge{display:flex;align-items:center;font-size:11px;color:var(--m1);letter-spacing:.04em;text-transform:uppercase;margin-top:6px}
  .logout{margin-top:10px;background:transparent;border:1px solid var(--b2);color:var(--m1);font-weight:600}
</style>
</head>
<body>

<div class="card gate" id="gateCard">
  <h1>Match Admin</h1>
  <p class="sub">Sign in to continue</p>
  <input type="text" id="emailInput" placeholder="Admin email" autocomplete="off">
  <input type="password" id="pwInput" placeholder="Password" autocomplete="off">
  <button id="pwBtn">Unlock</button>
  <div class="status-msg" id="gateMsg"></div>
</div>

<div class="card" id="formCard" style="display:none;max-width:480px">
  <h1>Live Match Tracker</h1>
  <p class="sub">Updates go live on the site instantly.</p>
  <div class="current-badge" id="currentBadge"></div>

  <label>Status</label>
  <select id="fStatus">
    <option value="hidden">Hidden</option>
    <option value="upcoming">Upcoming</option>
    <option value="live">Live</option>
    <option value="finished">Finished</option>
  </select>

  <label>Tournament Name</label>
  <input type="text" id="fTournament" placeholder="AS™#47">

  <label>Round</label>
  <input type="text" id="fRound" placeholder="Round 1">

  <label>Opponent</label>
  <input type="text" id="fOpponent" placeholder="TBA">

  <div class="row">
    <div>
      <label>BYTS Score</label>
      <input type="number" id="fByts" min="0" value="0">
    </div>
    <div>
      <label>Opponent Score</label>
      <input type="number" id="fOpp" min="0" value="0">
    </div>
  </div>

  <button id="saveBtn">Save &amp; Publish</button>
  <div class="status-msg" id="saveMsg"></div>

  <button class="logout" id="logoutBtn">Lock</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {
  getDatabase, ref, set, get, onValue, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAY49sWaN-DSKV10uyBB3CeOiABLCtFrSI",
  authDomain: "bytestorm-friebase-server.firebaseapp.com",
  databaseURL: "https://bytestorm-friebase-server-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "bytestorm-friebase-server",
  storageBucket: "bytestorm-friebase-server.firebasestorage.app",
  messagingSenderId: "400056781433",
  appId: "1:400056781433:web:9803b0711d85de437f62a8",
  measurementId: "G-TKJ9JKK7ZF"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const liveRef = ref(db, "liveMatch/current");

// ── Real Firebase Auth gate ──
// Access is enforced server-side by the Realtime Database rules
// (liveMatch write requires auth !== null, ideally scoped to the admin email).
const gateCard = document.getElementById('gateCard');
const formCard = document.getElementById('formCard');
const emailInput = document.getElementById('emailInput');
const pwInput = document.getElementById('pwInput');
const pwBtn = document.getElementById('pwBtn');
const gateMsg = document.getElementById('gateMsg');
const logoutBtn = document.getElementById('logoutBtn');

function showForm(){
  gateCard.style.display = 'none';
  formCard.style.display = 'block';
  loadCurrent();
}

function showGate(msg){
  formCard.style.display = 'none';
  gateCard.style.display = 'block';
  if(msg){
    gateMsg.textContent = msg;
    gateMsg.className = 'status-msg err';
  }
}

pwBtn.addEventListener('click', async () => {
  pwBtn.disabled = true;
  gateMsg.textContent = 'Signing in...';
  gateMsg.className = 'status-msg';
  try{
    await signInWithEmailAndPassword(auth, emailInput.value.trim(), pwInput.value);
    // onAuthStateChanged will handle showing the form
  } catch(e){
    gateMsg.textContent = 'Sign-in failed: ' + e.message;
    gateMsg.className = 'status-msg err';
  } finally {
    pwBtn.disabled = false;
  }
});
pwInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') pwBtn.click(); });
emailInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') pwBtn.click(); });

logoutBtn.addEventListener('click', async () => {
  await signOut(auth);
});

onAuthStateChanged(auth, (user) => {
  if(user){
    showForm();
  } else {
    showGate();
  }
});

// ── Form logic ──
const fStatus = document.getElementById('fStatus');
const fTournament = document.getElementById('fTournament');
const fRound = document.getElementById('fRound');
const fOpponent = document.getElementById('fOpponent');
const fByts = document.getElementById('fByts');
const fOpp = document.getElementById('fOpp');
const saveBtn = document.getElementById('saveBtn');
const saveMsg = document.getElementById('saveMsg');
const currentBadge = document.getElementById('currentBadge');

async function loadCurrent(){
  try{
    const snap = await get(liveRef);
    if(snap.exists()){
      const d = snap.val();
      fStatus.value = d.status || 'hidden';
      fTournament.value = d.tournament || '';
      fRound.value = d.round || '';
      fOpponent.value = d.opponent || '';
      fByts.value = d.byts ?? 0;
      fOpp.value = d.opp ?? 0;
    }
  } catch(e){
    saveMsg.textContent = 'Could not load current data: ' + e.message;
    saveMsg.className = 'status-msg err';
  }
}

// live badge showing current published state while editing
onValue(liveRef, (snap) => {
  if(!snap.exists()) { currentBadge.innerHTML = ''; return; }
  const d = snap.val();
  if(d.status === 'live'){
    currentBadge.innerHTML = `<span class="live-dot"></span>Currently LIVE — BYTS ${d.byts ?? 0} – ${d.opp ?? 0} ${(d.opponent||'').toUpperCase()}`;
  } else {
    currentBadge.textContent = `Currently: ${d.status || 'hidden'}`;
  }
});

saveBtn.addEventListener('click', async () => {
  saveBtn.disabled = true;
  saveMsg.textContent = 'Saving...';
  saveMsg.className = 'status-msg';
  try{
    await set(liveRef, {
      status: fStatus.value,
      tournament: fTournament.value.trim(),
      round: fRound.value.trim(),
      opponent: fOpponent.value.trim() || 'TBA',
      byts: Number(fByts.value) || 0,
      opp: Number(fOpp.value) || 0,
      updatedAt: serverTimestamp()
    });
    saveMsg.textContent = 'Published — live on site now.';
    saveMsg.className = 'status-msg ok';
  } catch(e){
    saveMsg.textContent = 'Error: ' + e.message;
    saveMsg.className = 'status-msg err';
  } finally {
    saveBtn.disabled = false;
  }
});
</script>
</body>
</html>
